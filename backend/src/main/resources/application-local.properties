# Self-contained demo profile (--spring.profiles.active=local): in-memory H2, no environment
# variables needed. Schema is created on startup and dropped on shutdown; DemoDataLoader seeds it.
spring.datasource.url=jdbc:h2:mem:dewecs_local;MODE=PostgreSQL;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Local profile: keep uploaded photos out of the project folder
dewecs.photos.dir=${java.io.tmpdir}/dewecs-photos
dewecs.api.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
