spring.application.name=dewecs
spring.profiles.active=prod

# Datasource comes from environment variables only (see .env.example). No defaults on purpose.
spring.datasource.url=jdbc:postgresql://ep-shy-firefly-b4tftv64-pooler.c-6.us-east-2.aws.neon.tech/prod?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_S7ihUD4brJYK
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Photo uploads (mobile API). The service enforces 5 MB itself; the container limit is slightly above it.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
dewecs.photos.dir=uploads/ground-reports
# filesystem (default) or s3. For s3 set DEWECS_PHOTOS_S3_BUCKET and DEWECS_PHOTOS_S3_REGION, plus the standard
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY environment variables. Never put keys in this file.
dewecs.photos.storage=${DEWECS_PHOTOS_STORAGE:filesystem}
dewecs.photos.s3.bucket=${DEWECS_PHOTOS_S3_BUCKET:}
dewecs.photos.s3.region=${DEWECS_PHOTOS_S3_REGION:}
dewecs.photos.s3.prefix=ground-reports/

# CORS for /api/** (empty = off; local profile enables localhost for a Flutter web build)
dewecs.api.cors.allowed-origin-patterns=
