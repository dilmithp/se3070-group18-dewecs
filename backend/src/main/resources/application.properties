spring.application.name=dewecs

# Datasource comes from environment variables only (see .env.example). No defaults on purpose.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Photo uploads (mobile API). The service enforces 5 MB itself; the container limit is slightly above it.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
dewecs.photos.dir=uploads/ground-reports

# CORS for /api/** (empty = off; local profile enables localhost for a Flutter web build)
dewecs.api.cors.allowed-origin-patterns=
