<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Relief supply')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: nav('supplies')}"></th:block>

<main id="main" class="container">
    <div th:replace="~{fragments/layout :: pageHeader(${supply.name + ' — ' + supply.districtName}, null)}"></div>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <section class="card">
        <dl class="detail-grid">
            <dt>Category</dt>
            <dd><th:block th:replace="~{fragments/layout :: enumLabel(${supply.type})}"></th:block></dd>

            <dt>Stock</dt>
            <dd>
                <span th:text="${supply.quantity} + ' ' + ${supply.unit}"></span>
                <span th:if="${supply.outOfStock}" class="badge badge-danger">OUT OF STOCK</span>
                <span th:if="${!supply.outOfStock and supply.lowStock}" class="badge badge-warning">LOW STOCK</span>
            </dd>

            <dt>Owning organization</dt>
            <dd th:text="${supply.organizationName}"></dd>
        </dl>
    </section>

    <div class="actions">
        <a th:href="@{/relief-supplies/{id}/edit(id=${supply.id})}" class="btn btn-secondary">Edit</a>
        <a th:href="@{/relief-supplies}" class="btn btn-link">Back to list</a>
    </div>

    <section class="card">
        <h2>Restock</h2>
        <form th:action="@{/relief-supplies/{id}/restock(id=${supply.id})}" th:object="${restockForm}" method="post">
            <div class="form-grid">
                <div class="field">
                    <label for="quantity">Additional quantity <span class="req" aria-hidden="true">*</span></label>
                    <input type="number" min="1" th:field="*{quantity}" aria-required="true"/>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Add stock</button>
            </div>
        </form>
    </section>
</main>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
