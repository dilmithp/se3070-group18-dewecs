<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${resourceId != null} ? 'Edit relief supply' : 'New relief supply')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: nav('supplies')}"></th:block>

<main id="main" class="container">
    <div th:replace="~{fragments/layout :: pageHeader(${resourceId != null} ? 'Edit relief supply' : 'New relief supply', null)}"></div>

    <form th:action="${resourceId != null} ? @{/relief-supplies/{id}(id=${resourceId})} : @{/relief-supplies}"
          th:object="${form}" method="post" class="card">

        <p class="form-errors" role="alert" th:if="${#fields.hasErrors('global')}" th:errors="*{global}"></p>

        <div class="form-grid">
            <div class="field" th:classappend="${#fields.hasErrors('districtId')} ? 'has-error'">
                <label for="districtId">District <span class="req" aria-hidden="true">*</span></label>
                <span class="help" th:if="${resourceId != null}">Changing this here has no effect: the district is fixed after creation.</span>
                <select th:field="*{districtId}" aria-required="true"
                        th:attr="aria-invalid=${#fields.hasErrors('districtId')} ? 'true' : null, aria-describedby=${#fields.hasErrors('districtId')} ? 'districtId-error' : null">
                    <option value="">-- select --</option>
                    <option th:each="d : ${districts}" th:value="${d.id}" th:text="${d.name}"></option>
                </select>
                <p class="field-error" id="districtId-error" th:if="${#fields.hasErrors('districtId')}" th:errors="*{districtId}"></p>
            </div>

            <div class="field" th:classappend="${#fields.hasErrors('organizationId')} ? 'has-error'">
                <label for="organizationId">Owning organization <span class="req" aria-hidden="true">*</span></label>
                <span class="help" th:if="${resourceId != null}">Changing this here has no effect: the organization is fixed after creation.</span>
                <select th:field="*{organizationId}" aria-required="true"
                        th:attr="aria-invalid=${#fields.hasErrors('organizationId')} ? 'true' : null, aria-describedby=${#fields.hasErrors('organizationId')} ? 'organizationId-error' : null">
                    <option value="">-- select --</option>
                    <option th:each="o : ${organizations}" th:value="${o.id}" th:text="${o.name}"></option>
                </select>
                <p class="field-error" id="organizationId-error" th:if="${#fields.hasErrors('organizationId')}" th:errors="*{organizationId}"></p>
            </div>

            <div class="field" th:classappend="${#fields.hasErrors('name')} ? 'has-error'">
                <label for="name">Name <span class="req" aria-hidden="true">*</span></label>
                <input type="text" th:field="*{name}" aria-required="true"
                       th:attr="aria-invalid=${#fields.hasErrors('name')} ? 'true' : null, aria-describedby=${#fields.hasErrors('name')} ? 'name-error' : null"/>
                <p class="field-error" id="name-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
            </div>

            <div class="field" th:classappend="${#fields.hasErrors('type')} ? 'has-error'">
                <label for="type">Category <span class="req" aria-hidden="true">*</span></label>
                <select th:field="*{type}" aria-required="true"
                        th:attr="aria-invalid=${#fields.hasErrors('type')} ? 'true' : null, aria-describedby=${#fields.hasErrors('type')} ? 'type-error' : null">
                    <option value="">-- select --</option>
                    <option th:each="t : ${types}" th:value="${t.name()}"><th:block th:replace="~{fragments/layout :: enumLabel(${t.name()})}"></th:block></option>
                </select>
                <p class="field-error" id="type-error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></p>
            </div>

            <div class="field" th:classappend="${#fields.hasErrors('unit')} ? 'has-error'">
                <label for="unit">Unit <span class="req" aria-hidden="true">*</span></label>
                <input type="text" th:field="*{unit}" placeholder="kg, boxes, liters..." aria-required="true"
                       th:attr="aria-invalid=${#fields.hasErrors('unit')} ? 'true' : null, aria-describedby=${#fields.hasErrors('unit')} ? 'unit-error' : null"/>
                <p class="field-error" id="unit-error" th:if="${#fields.hasErrors('unit')}" th:errors="*{unit}"></p>
            </div>

            <div class="field" th:classappend="${#fields.hasErrors('quantity')} ? 'has-error'">
                <label for="quantity">Quantity <span class="req" aria-hidden="true">*</span></label>
                <span class="help" th:if="${resourceId != null}">Changing this here has no effect: use Restock instead.</span>
                <input type="number" min="0" th:field="*{quantity}" aria-required="true"
                       th:attr="aria-invalid=${#fields.hasErrors('quantity')} ? 'true' : null, aria-describedby=${#fields.hasErrors('quantity')} ? 'quantity-error' : null"/>
                <p class="field-error" id="quantity-error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></p>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary" th:text="${resourceId != null} ? 'Save changes' : 'Create supply'"></button>
            <a th:href="${resourceId != null} ? @{/relief-supplies/{id}(id=${resourceId})} : @{/relief-supplies}" class="btn btn-link">Cancel</a>
        </div>
    </form>
</main>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
