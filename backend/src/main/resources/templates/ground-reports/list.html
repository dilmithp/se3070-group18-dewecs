<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ground reports')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: nav('reports')}"></th:block>

<main id="main" class="container">
    <div th:replace="~{fragments/layout :: pageHeader('Ground Reports', 'Reports sent by citizens from the field. Review them, then act or dismiss.')}"></div>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <form method="get" th:action="@{/ground-reports}" class="filter-bar card">
        <div class="field">
            <label for="f-status">Status</label>
            <select id="f-status" name="status">
                <option value="">All statuses</option>
                <option th:each="s : ${statuses}" th:value="${s.name()}" th:selected="${s.name() == selectedStatus}"><th:block th:replace="~{fragments/layout :: enumLabel(${s.name()})}"></th:block></option>
            </select>
        </div>
        <div class="field">
            <label for="f-category">Category</label>
            <select id="f-category" name="category">
                <option value="">All categories</option>
                <option th:each="c : ${categories}" th:value="${c.name()}" th:selected="${c.name() == selectedCategory}"><th:block th:replace="~{fragments/layout :: enumLabel(${c.name()})}"></th:block></option>
            </select>
        </div>
        <div class="field">
            <label for="f-district">Region</label>
            <select id="f-district" name="districtId">
                <option value="">All regions</option>
                <option th:each="d : ${districts}" th:value="${d.id}" th:text="${d.name}"
                        th:selected="${d.id == selectedDistrictId}"></option>
            </select>
        </div>
        <div class="filter-actions">
            <button type="submit" class="btn btn-secondary">Filter</button>
        </div>
    </form>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th scope="col">Reporter</th>
                <th scope="col">Region</th>
                <th scope="col">Category</th>
                <th scope="col">Status</th>
                <th scope="col">Submitted at</th>
                <th scope="col"><span class="visually-hidden">Actions</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${reports}">
                <td th:text="${r.reporterName}"></td>
                <td th:text="${r.districtName}"></td>
                <td><th:block th:replace="~{fragments/layout :: enumLabel(${r.category})}"></th:block></td>
                <td><span th:replace="~{fragments/layout :: badge(${r.status})}"></span></td>
                <td class="nowrap"><th:block th:replace="~{fragments/layout :: time(${r.submittedAt})}"></th:block></td>
                <td><a th:href="@{/ground-reports/{id}(id=${r.id})}" class="btn btn-link">View</a></td>
            </tr>
            <tr th:if="${reports.isEmpty()}">
                <td colspan="6" class="empty">No ground reports match this filter. Clear the filters, or wait for new reports from the field.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
