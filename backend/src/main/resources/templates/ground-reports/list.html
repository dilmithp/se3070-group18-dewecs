<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ground Reports</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<h1>Ground Reports</h1>

<p th:if="${message}" class="flash" th:text="${message}"></p>
<p th:if="${error}" class="flash-error" th:text="${error}"></p>

<form method="get" th:action="@{/ground-reports}" class="filter-bar">
    <select name="status">
        <option value="">All statuses</option>
        <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.name()}"
                th:selected="${s.name() == selectedStatus}"></option>
    </select>
    <select name="category">
        <option value="">All categories</option>
        <option th:each="c : ${categories}" th:value="${c.name()}" th:text="${c.name()}"
                th:selected="${c.name() == selectedCategory}"></option>
    </select>
    <select name="districtId">
        <option value="">All regions</option>
        <option th:each="d : ${districts}" th:value="${d.id}" th:text="${d.name}"
                th:selected="${d.id == selectedDistrictId}"></option>
    </select>
    <button type="submit">Filter</button>
</form>

<table>
    <thead>
    <tr>
        <th>Reporter</th>
        <th>Region</th>
        <th>Category</th>
        <th>Status</th>
        <th>Submitted at</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${reports}">
        <td th:text="${r.reporterName}"></td>
        <td th:text="${r.districtName}"></td>
        <td th:text="${r.category}"></td>
        <td th:text="${r.status}"></td>
        <td th:text="${r.submittedAt}"></td>
        <td><a th:href="@{/ground-reports/{id}(id=${r.id})}">View</a></td>
    </tr>
    <tr th:if="${reports.isEmpty()}">
        <td colspan="6">No ground reports match this filter.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
