<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Warning detail')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: nav('warnings')}"></th:block>

<main id="main" class="container">
    <div th:replace="~{fragments/layout :: pageHeader(${#strings.capitalize(#strings.toLowerCase(warning.hazardType)) + ' warning — ' + warning.districtName}, null)}"></div>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <section class="card">
        <dl class="detail-grid">
            <dt>Status</dt>
            <dd><span th:replace="~{fragments/layout :: badge(${warning.status})}"></span></dd>

            <dt>Severity</dt>
            <dd><span th:replace="~{fragments/layout :: badge(${warning.severity})}"></span></dd>

            <dt>Message</dt>
            <dd th:text="${warning.message} ?: '—'"></dd>

            <dt>Broadcast channels</dt>
            <dd th:text="${#lists.isEmpty(warning.broadcastChannels)} ? '—' : ${#strings.listJoin(warning.broadcastChannels, ', ')}"></dd>

            <dt>Issued by</dt>
            <dd th:text="${warning.issuedByName}"></dd>

            <dt>Issued at</dt>
            <dd><th:block th:replace="~{fragments/layout :: time(${warning.issuedAt})}"></th:block></dd>

            <dt>Expires at</dt>
            <dd><th:block th:replace="~{fragments/layout :: time(${warning.expiresAt})}"></th:block></dd>
        </dl>
    </section>

    <div class="actions">
        <form th:if="${warning.status == 'DRAFT'}" th:action="@{/warnings/{id}/publish(id=${warning.id})}"
              method="post" class="inline-form">
            <button type="submit" class="btn btn-primary">Publish</button>
        </form>

        <a th:if="${warning.status == 'DRAFT'}" th:href="@{/warnings/{id}/edit(id=${warning.id})}" class="btn btn-secondary">Edit</a>

        <form th:if="${warning.status == 'DRAFT' or warning.status == 'ISSUED'}"
              th:action="@{/warnings/{id}/retract(id=${warning.id})}" method="post" class="inline-form">
            <button type="submit" class="btn btn-danger"
                    data-confirm="Retract this warning? It will no longer count as open.">Retract</button>
        </form>

        <a th:href="@{/warnings}" class="btn btn-link">Back to list</a>
    </div>
</main>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
