<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Warnings')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: nav('warnings')}"></th:block>

<main id="main" class="container">
    <div th:replace="~{fragments/layout :: pageHeader('Warnings', 'Draft, publish and retract public warnings.')}"></div>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <form method="get" th:action="@{/warnings}" class="filter-bar card">
        <div class="field">
            <label for="f-status">Status</label>
            <select id="f-status" name="status">
                <option value="">All statuses</option>
                <option th:each="s : ${statuses}" th:value="${s.name()}" th:selected="${s.name() == selectedStatus}"><th:block th:replace="~{fragments/layout :: enumLabel(${s.name()})}"></th:block></option>
            </select>
        </div>
        <div class="field">
            <label for="f-district">Region</label>
            <select id="f-district" name="districtId">
                <option value="">All regions</option>
                <option th:each="d : ${districts}" th:value="${d.id}" th:text="${d.name}"
                        th:selected="${d.id == selectedDistrictId}"></option>
            </select>
        </div>
        <div class="filter-actions">
            <button type="submit" class="btn btn-secondary">Filter</button>
            <a th:href="@{/warnings/new}" class="btn btn-primary">+ New warning</a>
        </div>
    </form>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th scope="col">Hazard</th>
                <th scope="col">Region</th>
                <th scope="col">Severity</th>
                <th scope="col">Status</th>
                <th scope="col">Issued at</th>
                <th scope="col">Expires at</th>
                <th scope="col"><span class="visually-hidden">Actions</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="w : ${warnings}">
                <td><th:block th:replace="~{fragments/layout :: enumLabel(${w.hazardType})}"></th:block></td>
                <td th:text="${w.districtName}"></td>
                <td><span th:replace="~{fragments/layout :: badge(${w.severity})}"></span></td>
                <td><span th:replace="~{fragments/layout :: badge(${w.status})}"></span></td>
                <td class="nowrap"><th:block th:replace="~{fragments/layout :: time(${w.issuedAt})}"></th:block></td>
                <td class="nowrap"><th:block th:replace="~{fragments/layout :: time(${w.expiresAt})}"></th:block></td>
                <td><a th:href="@{/warnings/{id}(id=${w.id})}" class="btn btn-link">View</a></td>
            </tr>
            <tr th:if="${warnings.isEmpty()}">
                <td colspan="7" class="empty">No warnings match this filter. Clear the filters or create a new warning.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
