<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Relief distribution')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: nav('distributions')}"></th:block>

<main id="main" class="container">
    <div th:replace="~{fragments/layout :: pageHeader(${distribution.resourceName + ' → ' + distribution.shelterName}, null)}"></div>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <section class="card">
        <dl class="detail-grid">
            <dt>Status</dt>
            <dd><span th:replace="~{fragments/layout :: badge(${distribution.status})}"></span></dd>

            <dt>Quantity</dt>
            <dd th:text="${distribution.quantity} + ' ' + ${distribution.resourceUnit}"></dd>

            <dt>Source organization</dt>
            <dd th:text="${distribution.organizationName}"></dd>

            <dt>Dispatched at</dt>
            <dd><th:block th:replace="~{fragments/layout :: time(${distribution.dispatchedAt})}"></th:block></dd>

            <dt>Delivered at</dt>
            <dd><th:block th:replace="~{fragments/layout :: time(${distribution.deliveredAt})}"></th:block></dd>
        </dl>
    </section>

    <div class="actions">
        <form th:if="${distribution.status == 'DISPATCHED'}"
              th:action="@{/relief-distributions/{id}/deliver(id=${distribution.id})}" method="post" class="inline-form">
            <button type="submit" class="btn btn-primary">Mark delivered</button>
        </form>

        <form th:if="${distribution.status == 'DISPATCHED'}"
              th:action="@{/relief-distributions/{id}/cancel(id=${distribution.id})}" method="post" class="inline-form">
            <button type="submit" class="btn btn-danger"
                    data-confirm="Cancel this distribution? The quantity returns to stock.">Cancel</button>
        </form>

        <a th:href="@{/relief-distributions}" class="btn btn-link">Back to list</a>
    </div>
</main>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
