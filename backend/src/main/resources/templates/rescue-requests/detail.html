<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Rescue request')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: nav('rescue')}"></th:block>

<main id="main" class="container">
    <div th:replace="~{fragments/layout :: pageHeader(${'Rescue request — ' + request.requesterName}, null)}"></div>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <section class="card">
        <dl class="detail-grid">
            <dt>Status</dt>
            <dd><span th:replace="~{fragments/layout :: badge(${request.status})}"></span></dd>

            <dt>Priority</dt>
            <dd><span th:replace="~{fragments/layout :: badge(${request.priority})}"></span></dd>

            <dt>Region</dt>
            <dd th:text="${request.districtName}"></dd>

            <dt>Requester phone</dt>
            <dd th:text="${request.requesterPhone}"></dd>

            <dt>GPS</dt>
            <dd th:text="(${request.gpsLat} != null and ${request.gpsLng} != null) ? (${request.gpsLat} + ', ' + ${request.gpsLng}) : '—'"></dd>
            <dt th:if="${request.gpsLat != null and request.gpsLng != null}">Map</dt>
            <dd th:if="${request.gpsLat != null and request.gpsLng != null}"><div th:replace="~{fragments/layout :: mapView(${request.gpsLat}, ${request.gpsLng})}"></div></dd>

            <dt>Description</dt>
            <dd th:text="${request.description}"></dd>

            <dt>Assigned team</dt>
            <dd th:text="${request.assignedTeamName} ?: '—'"></dd>

            <dt>Submitted at</dt>
            <dd><th:block th:replace="~{fragments/layout :: time(${request.submittedAt})}"></th:block></dd>

            <dt>Assigned at</dt>
            <dd><th:block th:replace="~{fragments/layout :: time(${request.assignedAt})}"></th:block></dd>

            <dt>Completed at</dt>
            <dd><th:block th:replace="~{fragments/layout :: time(${request.completedAt})}"></th:block></dd>
        </dl>
    </section>

    <section class="card" th:if="${request.status == 'PENDING'}">
        <h2>Assign a team</h2>
        <form th:action="@{/rescue-requests/{id}/assign(id=${request.id})}" method="post" class="inline-form">
            <div class="field">
                <label for="teamId">Team</label>
                <select id="teamId" name="teamId" aria-describedby="teamId-help">
                    <option th:each="t : ${availableTeams}" th:value="${t.id}" th:text="${t.name}"></option>
                </select>
                <span class="help" id="teamId-help" th:if="${#lists.isEmpty(availableTeams)}">No team is available right now.</span>
            </div>
            <button type="submit" class="btn btn-primary">Assign</button>
        </form>
    </section>

    <div class="actions">
        <form th:if="${request.status == 'ASSIGNED'}" th:action="@{/rescue-requests/{id}/complete(id=${request.id})}"
              method="post" class="inline-form">
            <button type="submit" class="btn btn-primary">Complete</button>
        </form>

        <form th:if="${request.status == 'PENDING' or request.status == 'ASSIGNED'}"
              th:action="@{/rescue-requests/{id}/cancel(id=${request.id})}" method="post" class="inline-form">
            <button type="submit" class="btn btn-danger"
                    data-confirm="Cancel this rescue request? An assigned team becomes available again.">Cancel</button>
        </form>

        <a th:href="@{/rescue-requests}" class="btn btn-link">Back to list</a>
    </div>
</main>
<script th:src="@{/js/app.js}" defer></script>
<script th:src="@{/js/map.js}" defer></script>
</body>
</html>
