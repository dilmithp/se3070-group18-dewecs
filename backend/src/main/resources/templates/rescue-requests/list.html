<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rescue Requests</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<h1>Rescue Requests</h1>

<p th:if="${message}" class="flash" th:text="${message}"></p>
<p th:if="${error}" class="flash-error" th:text="${error}"></p>

<form method="get" th:action="@{/rescue-requests}" class="filter-bar">
    <select name="status">
        <option value="">All statuses</option>
        <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.name()}"
                th:selected="${s.name() == selectedStatus}"></option>
    </select>
    <select name="priority">
        <option value="">All priorities</option>
        <option th:each="p : ${priorities}" th:value="${p.name()}" th:text="${p.name()}"
                th:selected="${p.name() == selectedPriority}"></option>
    </select>
    <select name="districtId">
        <option value="">All regions</option>
        <option th:each="d : ${districts}" th:value="${d.id}" th:text="${d.name}"
                th:selected="${d.id == selectedDistrictId}"></option>
    </select>
    <button type="submit">Filter</button>
    <a th:href="@{/rescue-requests/new}" class="button">+ New request</a>
</form>

<table>
    <thead>
    <tr>
        <th>Requester</th>
        <th>Region</th>
        <th>Priority</th>
        <th>Status</th>
        <th>Assigned team</th>
        <th>Submitted at</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${requests}">
        <td th:text="${r.requesterName}"></td>
        <td th:text="${r.districtName}"></td>
        <td th:text="${r.priority}"></td>
        <td th:text="${r.status}"></td>
        <td th:text="${r.assignedTeamName} ?: '—'"></td>
        <td th:text="${r.submittedAt}"></td>
        <td><a th:href="@{/rescue-requests/{id}(id=${r.id})}">View</a></td>
    </tr>
    <tr th:if="${requests.isEmpty()}">
        <td colspan="7">No rescue requests match this filter.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
