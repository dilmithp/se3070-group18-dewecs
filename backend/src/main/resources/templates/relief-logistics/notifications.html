<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Agency notifications')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: nav('logistics')}"></th:block>

<main id="main" class="container">
    <div th:replace="~{fragments/layout :: pageHeader('Agency notifications', 'What every responding agency was told about dispatches, handovers and the district fulfilment.')}"></div>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <p class="help">These notifications are recorded here. Nothing is sent outside the system yet.</p>

    <div class="table-wrap">
        <table>
            <thead>
            <tr><th scope="col">Time</th><th scope="col">Agency</th><th scope="col">Consignment</th><th scope="col">Message</th></tr>
            </thead>
            <tbody>
            <tr th:each="n : ${notifications}">
                <td class="nowrap"><th:block th:replace="~{fragments/layout :: time(${n.time})}"></th:block></td>
                <td th:text="${n.organizationName}"></td>
                <td th:text="${n.reference} ?: '—'"></td>
                <td th:text="${n.message}"></td>
            </tr>
            <tr th:if="${notifications.isEmpty()}"><td colspan="4" class="empty">No notifications yet. They are written when a consignment is dispatched or handed over.</td></tr>
            </tbody>
        </table>
    </div>
    <p><a th:href="@{/relief-logistics}" class="btn btn-link">Back to the command center</a></p>
</main>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
