<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Something went wrong')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: nav('none')}"></th:block>

<main id="main" class="container">
    <section class="card error-page">
        <p class="error-code" th:text="${status}">500</p>
        <h1 th:text="${error}">Error</h1>
        <p class="flash-error" role="alert" th:text="${message}">Something went wrong.</p>
        <div class="actions">
            <a th:href="@{/dashboard}" class="btn btn-primary">Back to the dashboard</a>
        </div>
    </section>
</main>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
